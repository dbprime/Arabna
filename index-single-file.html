  <style>
/* ============================================================
   ARABNA — Design System  (V.01)
   Dark navy / antique gold · Arabic-first · RTL & LTR safe
   ============================================================ */

:root {
  --navy:        #0B1526;
  --surface:     #141F3B;
  --surface-2:   #1C2A4D;
  --gold:        #C6A15B;
  --gold-bright: #E4C77E;
  --ivory:       #F3F1EC;
  --muted:       #8B93AC;
  --green:       #4E8B6B;
  --danger:      #C4595C;

  --line:        rgba(198, 161, 91, 0.16);
  --line-soft:   rgba(255, 255, 255, 0.07);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 26px;

  --header-h: 84px;
  --nav-h: 78px;

  --shadow-1: 0 2px 10px rgba(0, 0, 0, 0.35);
  --shadow-2: 0 10px 30px rgba(0, 0, 0, 0.45);

  --ease: cubic-bezier(0.22, 0.8, 0.3, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: #070d18;
  color: var(--ivory);
  font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  overscroll-behavior-y: none;
}

body {
  min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(198,161,91,0.10), transparent 60%),
    #070d18;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
ul { margin: 0; padding: 0; list-style: none; }

/* ---------- device frame ---------- */
.phone {
  position: relative;
  width: 100%;
  max-width: 460px;
  height: 100dvh;
  max-height: 100dvh;
  background: var(--navy);
  display: flex; flex-direction: column;
  overflow: hidden;
}
@media (min-width: 900px) {
  .phone {
    height: min(920px, 96dvh);
    border-radius: 34px;
    border: 1px solid rgba(198,161,91,0.22);
    box-shadow: 0 40px 90px rgba(0,0,0,0.6), 0 0 0 10px rgba(255,255,255,0.02);
  }
}

/* ---------- header ---------- */
.app-header {
  flex: 0 0 auto;
  height: var(--header-h);
  padding: 0 14px;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, rgba(20,31,59,0.98), rgba(11,21,38,0.92));
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 20;
}
.app-header .h-logo {
  height: 52px; width: auto; max-width: 60%;
  object-fit: contain;                 /* keeps the official aspect ratio, never crops */
  margin-inline: auto;
}
.app-header .h-title { flex: 1; text-align: center; font-weight: 700; font-size: 18px; }

.icon-btn {
  width: 44px; height: 44px; flex: 0 0 44px;
  display: grid; place-items: center;
  border-radius: 12px;
  color: var(--ivory);
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line-soft);
  transition: background .18s var(--ease), transform .12s var(--ease);
  position: relative;
}
.icon-btn:active { transform: scale(0.93); background: rgba(198,161,91,0.16); }
.icon-btn .dot {
  position: absolute; inset-block-start: 7px; inset-inline-end: 8px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--gold-bright); border: 2px solid var(--surface);
}
.lang-pill {
  height: 34px; padding: 0 11px;
  display: grid; place-items: center;
  border-radius: 999px;
  font-weight: 700; font-size: 12px; letter-spacing: .5px;
  color: var(--gold-bright);
  background: rgba(198,161,91,0.12);
  border: 1px solid var(--line);
}

/* ---------- main scroll area ---------- */
.app-main {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--nav-h) + 18px);
  scrollbar-width: none;
}
.app-main::-webkit-scrollbar { display: none; }
.screen { animation: fade .28s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity:1; transform:none;} }

.pad { padding-inline: 14px; }
.section { margin-top: 28px; }
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-inline: 14px; margin-bottom: 10px;
}
.section-title { font-weight: 700; font-size: 18px; }
.section-title small { display:block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
.link-gold { color: var(--gold-bright); font-size: 13.5px; font-weight: 700; display:flex; align-items:center; gap:3px; }

/* ---------- bottom nav ---------- */
.bottom-nav {
  position: absolute; inset-inline: 0; inset-block-end: 0;
  height: var(--nav-h);
  display: grid; grid-template-columns: repeat(5, 1fr);
  align-items: center;
  background: rgba(13, 24, 44, 0.96);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  z-index: 30;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--muted); font-size: 11.5px; font-weight: 600;
  transition: color .18s var(--ease);
}
.nav-item.active { color: var(--gold-bright); }
.nav-item.active svg { filter: drop-shadow(0 0 6px rgba(228,199,126,0.45)); }
.nav-item:active { transform: scale(0.94); }
.nav-post {
  width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(145deg, var(--gold-bright), var(--gold));
  color: #14213d;
  box-shadow: 0 6px 18px rgba(198,161,91,0.35);
  margin-top: -14px;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 52px; padding: 0 20px;
  border-radius: var(--r-md);
  font-weight: 700; font-size: 15.5px;
  transition: transform .12s var(--ease), opacity .18s var(--ease);
}
.btn:active { transform: scale(0.975); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn-gold { background: linear-gradient(145deg, var(--gold-bright), var(--gold)); color: #14213d; box-shadow: 0 6px 18px rgba(198,161,91,0.28); }
.btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--ivory); }
.btn-outline-gold { background: transparent; border: 1px solid var(--gold); color: var(--gold-bright); }
.btn-danger { background: rgba(196,89,92,0.14); border: 1px solid rgba(196,89,92,0.4); color: #E79A9C; }
.btn-block { width: 100%; }
.btn-sm { height: 40px; padding: 0 15px; font-size: 13.5px; border-radius: 10px; }

/* ---------- inputs ---------- */
.field { margin-bottom: 14px; }
.label { display: block; font-size: 13.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.input, .select, .textarea {
  width: 100%;
  height: 54px;
  padding: 0 16px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  color: var(--ivory);
  outline: none;
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.textarea { height: auto; min-height: 110px; padding: 12px 14px; resize: vertical; line-height: 1.6; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(198,161,91,0.15); }
.input::placeholder, .textarea::placeholder { color: #6C7594; }
.input-err { border-color: rgba(196,89,92,0.7) !important; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.err-msg { font-size: 13px; color: #E79A9C; margin-top: 6px; display: flex; gap: 5px; align-items: flex-start; }
.ok-msg { font-size: 13px; color: #8FD3AE; margin-top: 6px; }

.otp-row { display: flex; gap: 8px; direction: ltr; justify-content: center; margin: 6px 0 4px; }
.otp-box {
  width: 46px; height: 58px; text-align: center;
  font-size: 20px; font-weight: 700;
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: 12px; color: var(--ivory); outline: none;
}
.otp-box:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(198,161,91,0.15); }

/* ---------- search + location ---------- */
.search-wrap { padding: 12px 14px 0; }
.search-bar {
  display: flex; align-items: center; gap: 11px;
  height: 52px; padding: 0 16px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
}
.search-bar input { flex: 1; background: none; border: none; outline: none; }
.loc-bar {
  margin-top: 9px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: var(--muted);
}
.loc-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 14px;
  background: rgba(198,161,91,0.10);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--gold-bright); font-weight: 700; font-size: 13.5px;
}
.radius-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--line-soft);
  border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--ivory);
}

/* ---------- chips row ---------- */
.hscroll {
  display: flex; gap: 11px; align-items: flex-start;
  overflow-x: auto; scrollbar-width: none;
  padding-inline: 14px;
  scroll-snap-type: x proximity;
}
.hscroll::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  height: 40px; padding: 0 16px;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--line-soft);
  font-size: 13.5px; font-weight: 700; color: var(--muted);
  transition: all .18s var(--ease);
  white-space: nowrap;
}
.chip.active { background: linear-gradient(145deg, var(--gold-bright), var(--gold)); color: #14213d; border-color: transparent; }
.chip:active { transform: scale(0.96); }

/* ---------- category circles ---------- */
.cat-item { flex: 0 0 auto; width: 82px; text-align: center; scroll-snap-align: start;
  display: flex; flex-direction: column; align-items: center; }
.cat-circle {
  width: 66px; height: 66px; margin: 0 auto 8px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(150deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  color: var(--gold-bright);
  transition: transform .16s var(--ease), box-shadow .16s var(--ease);
}
.cat-item:active .cat-circle { transform: scale(0.93); box-shadow: 0 0 0 3px rgba(198,161,91,0.18); }
.cat-item.active .cat-circle { background: linear-gradient(150deg, var(--gold-bright), var(--gold)); color: #14213d; }
.cat-label { font-size: 12.5px; color: var(--muted); font-weight: 600; line-height: 1.3; display: block; }
.cat-item.active .cat-label { color: var(--gold-bright); }

/* ---------- primary ad slider ---------- */
.slider { position: relative; padding: 14px 14px 0; }
.slider-track { position: relative; height: 176px; border-radius: var(--r-lg); overflow: hidden; }
.slide {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: 16px 18px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  opacity: 0; transform: scale(0.98);
  transition: opacity .5s var(--ease), transform .5s var(--ease);
  pointer-events: none;
  overflow: hidden;
}
.slide.active { opacity: 1; transform: none; pointer-events: auto; }
.slide::after {
  content: ''; position: absolute; inset-block: -40%; inset-inline-end: -18%;
  width: 62%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.10), transparent 65%);
}
.slide-badge {
  align-self: flex-start;
  font-size: 11.5px; font-weight: 700; letter-spacing: .4px;
  padding: 3px 9px; border-radius: 999px;
  background: rgba(0,0,0,0.32); color: var(--ivory);
  border: 1px solid rgba(255,255,255,0.16);
  margin-bottom: 8px;
}
.slide-title { font-size: 23px; font-weight: 700; line-height: 1.25; }
.slide-sub { font-size: 14px; opacity: .88; margin-top: 3px; }
.slide-cta {
  align-self: flex-start; margin-top: 12px;
  height: 40px; padding: 0 18px; border-radius: 999px;
  background: rgba(255,255,255,0.94); color: #14213d;
  font-weight: 700; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px;
  position: relative; z-index: 2;
}
.slide-icon { position: absolute; inset-block-start: 50%; inset-inline-end: 18px; transform: translateY(-50%); opacity: .30; z-index: 1; }
.slide-house {
  background: linear-gradient(140deg, #1C2A4D, #0B1526);
  border: 1px dashed rgba(198,161,91,0.55) !important;
  align-items: center; text-align: center; justify-content: center;
}
.slide-house .slide-title { color: var(--gold-bright); }
.slider-dots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
.dot-i { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.22); transition: all .3s var(--ease); }
.dot-i.active { width: 18px; background: var(--gold-bright); }

/* ---------- mini ad banner ---------- */
.mini-ad {
  margin: 16px 14px 0;
  display: flex; align-items: center; gap: 12px;
  height: 62px; padding: 0 14px;
  border-radius: var(--r-md);
  background: linear-gradient(90deg, rgba(28,42,77,0.9), rgba(20,31,59,0.7));
  border: 1px solid var(--line-soft);
  overflow: hidden;
}
.mini-ad .m-ico { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; background: rgba(198,161,91,0.14); color: var(--gold-bright); flex: 0 0 38px; }
.mini-ad .m-name { font-size: 14.5px; font-weight: 700; }
.mini-ad .m-tag { font-size: 12.5px; color: var(--muted); }
.ad-label {
  margin-inline-start: auto; flex: 0 0 auto;
  font-size: 11px; font-weight: 700; letter-spacing: .4px;
  color: var(--muted); border: 1px solid var(--line-soft);
  padding: 2px 6px; border-radius: 5px;
}

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  overflow: hidden;
  transition: transform .14s var(--ease), border-color .18s var(--ease);
}
.card:active { transform: scale(0.985); }

.feat-card { flex: 0 0 auto; width: 205px; scroll-snap-align: start; }
.feat-cover {
  height: 110px; position: relative;
  display: grid; place-items: center;
  background: linear-gradient(140deg, var(--surface-2), var(--surface));
  color: var(--gold-bright);
}
.feat-body { padding: 12px 13px 14px; }
.feat-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
.feat-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 700;
  padding: 4px 9px; border-radius: 7px;
}
.badge-verified { background: rgba(198,161,91,0.16); color: var(--gold-bright); border: 1px solid var(--line); }
.badge-free { background: rgba(78,139,107,0.16); color: #7FC3A1; border: 1px solid rgba(78,139,107,0.35); }
.badge-boost { background: linear-gradient(145deg, var(--gold-bright), var(--gold)); color: #14213d; }
.badge-sponsored { background: rgba(255,255,255,0.07); color: var(--muted); border: 1px solid var(--line-soft); }
.badge-cat { background: rgba(28,42,77,0.9); color: var(--gold-bright); border: 1px solid var(--line); }

.stars { display: inline-flex; align-items: center; gap: 2px; color: var(--gold-bright); font-size: 12.5px; font-weight: 700; }

/* ---------- directory list rows ---------- */
.list-row {
  display: flex; gap: 13px; padding: 15px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  margin-bottom: 10px;
  align-items: flex-start;
  transition: transform .14s var(--ease);
}
.list-row.premium { border-color: rgba(198,161,91,0.42); background: linear-gradient(140deg, rgba(28,42,77,0.95), var(--surface)); }
.list-row:active { transform: scale(0.99); }
.row-ico {
  width: 54px; height: 54px; flex: 0 0 54px;
  border-radius: 12px; display: grid; place-items: center;
  background: rgba(198,161,91,0.10); color: var(--gold-bright);
  border: 1px solid var(--line);
}
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row-actions { display: flex; gap: 7px; margin-top: 9px; }
.mini-btn {
  height: 38px; padding: 0 13px; border-radius: 10px;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12.5px; font-weight: 700;
  background: rgba(255,255,255,0.05); border: 1px solid var(--line-soft); color: var(--ivory);
}
.mini-btn.gold { background: rgba(198,161,91,0.14); border-color: var(--line); color: var(--gold-bright); }
.mini-btn:active { transform: scale(0.95); }

/* ---------- upgrade banner ---------- */
.upsell {
  margin: 14px; padding: 14px;
  border-radius: var(--r-md);
  background: linear-gradient(135deg, rgba(198,161,91,0.16), rgba(28,42,77,0.7));
  border: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
}
.upsell-txt { flex: 1; }
.upsell-txt b { display: block; font-size: 15px; }
.upsell-txt span { font-size: 12.5px; color: var(--muted); }

/* ---------- classifieds grid ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; padding: 0 14px; }
.cl-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-md); overflow: hidden; }
.cl-card.boosted { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(198,161,91,0.35), 0 6px 20px rgba(198,161,91,0.12); }
.cl-img { height: 128px; display: grid; place-items: center; background: linear-gradient(140deg, var(--surface-2), #101a33); color: #5c6a8f; position: relative; }
.cl-body { padding: 11px 12px 13px; }
.cl-price { color: var(--gold-bright); font-weight: 700; font-size: 16.5px; }
.cl-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cl-meta { font-size: 11.5px; color: var(--muted); margin-top: 5px; display: flex; align-items: center; justify-content: space-between; gap: 4px; }

/* ---------- magazine ---------- */
.story-card { flex: 0 0 auto; width: 215px; scroll-snap-align: start; }
.story-cover { height: 116px; display: grid; place-items: center; background: linear-gradient(140deg, #24325A, #131E39); color: var(--gold-bright); position: relative; }
.mag-card { display: flex; gap: 13px; padding: 13px; margin-bottom: 11px; }
.mag-thumb { width: 108px; height: 92px; flex: 0 0 108px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(140deg, #24325A, #131E39); color: var(--gold-bright); }
.mag-title { font-size: 15px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mag-ex { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mag-meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: flex; gap: 8px; align-items: center; }

.article-hero { height: 190px; display: grid; place-items: center; background: linear-gradient(140deg, #24325A, #101a33); color: var(--gold-bright); position: relative; }
.article-body { padding: 16px 16px 30px; }
.article-body h1 { font-size: 23px; line-height: 1.4; margin: 10px 0 6px; }
.article-body p { font-size: 15.5px; line-height: 1.95; color: #DAD8D2; margin: 0 0 15px; }

/* ---------- detail page ---------- */
.detail-hero {
  height: 168px; position: relative;
  display: grid; place-items: center;
  background: linear-gradient(150deg, var(--surface-2), var(--navy));
  border-bottom: 1px solid var(--line);
}
.back-btn {
  position: absolute; inset-block-start: 12px; inset-inline-start: 12px;
  width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center;
  background: rgba(11,21,38,0.75); border: 1px solid var(--line-soft);
  backdrop-filter: blur(8px); z-index: 5;
}
.detail-body { padding: 16px 14px 26px; }
.detail-title { font-size: 22px; font-weight: 700; }
.info-row { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
.info-row .i-ico { color: var(--gold-bright); flex: 0 0 20px; margin-top: 2px; }
.info-row .i-txt b { display: block; font-size: 15px; font-weight: 700; }
.info-row .i-txt span { font-size: 12.5px; color: var(--muted); }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 14px 0; }

.locked {
  position: relative; border-radius: var(--r-md);
  border: 1px dashed rgba(198,161,91,0.45);
  background: rgba(28,42,77,0.5);
  padding: 20px 16px; text-align: center;
}
.locked .lk-ico { color: var(--gold); margin-bottom: 8px; }
.locked b { display: block; font-size: 14px; margin-bottom: 4px; }
.locked span { font-size: 12px; color: var(--muted); display: block; margin-bottom: 12px; }

.photo-strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.photo-strip::-webkit-scrollbar { display: none; }
.photo-tile { flex: 0 0 120px; height: 94px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(140deg, var(--surface-2), #101a33); color: #6B77A0; border: 1px solid var(--line-soft); }

.review { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.review-head { display: flex; align-items: center; gap: 8px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(198,161,91,0.14); color: var(--gold-bright); font-weight: 700; font-size: 12px; }
.review p { margin: 8px 0 0; font-size: 14px; color: #D6D4CE; }

/* ---------- drawer ---------- */
.drawer-root { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.drawer-root.open { pointer-events: auto; }
.drawer-scrim { position: absolute; inset: 0; background: rgba(4,8,16,0.66); opacity: 0; transition: opacity .3s var(--ease); backdrop-filter: blur(2px); }
.drawer-root.open .drawer-scrim { opacity: 1; }
.drawer-panel {
  position: absolute; inset-block: 0; inset-inline-start: 0;
  width: min(320px, 84%);
  background: linear-gradient(180deg, #101B33, #0B1526);
  border-inline-end: 1px solid var(--line);
  transform: translateX(var(--drawer-off, -100%));
  transition: transform .32s var(--ease);
  display: flex; flex-direction: column;
  overflow-y: auto; scrollbar-width: none;
}
html[dir="rtl"] .drawer-panel { --drawer-off: 100%; }
.drawer-root.open .drawer-panel { transform: translateX(0); }
.drawer-head { padding: 20px 18px 16px; border-bottom: 1px solid var(--line-soft); text-align: center; }
.drawer-head img { height: 46px; margin: 0 auto 10px; }
.drawer-user { font-size: 12.5px; color: var(--muted); }
.dr-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; width: 100%;
  font-size: 15px; font-weight: 600; text-align: start;
  border-bottom: 1px solid rgba(255,255,255,0.035);
}
.dr-item svg { color: var(--gold); flex: 0 0 20px; }
.dr-item:active { background: rgba(198,161,91,0.08); }
.dr-item .chev { margin-inline-start: auto; color: var(--muted); }
.dr-group-label { padding: 16px 18px 6px; font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--muted); }

/* ---------- bottom sheet / modal ---------- */
.sheet-root { position: fixed; inset: 0; z-index: 120; pointer-events: none; display: flex; align-items: flex-end; justify-content: center; }
.sheet-root.open { pointer-events: auto; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(4,8,16,0.7); opacity: 0; transition: opacity .28s var(--ease); }
.sheet-root.open .sheet-scrim { opacity: 1; }
.sheet-panel {
  position: relative;
  width: 100%; max-width: 460px;
  max-height: 88dvh; overflow-y: auto; scrollbar-width: none;
  background: linear-gradient(180deg, #16223F, #0D1728);
  border-top-left-radius: var(--r-xl); border-top-right-radius: var(--r-xl);
  border: 1px solid var(--line); border-bottom: none;
  padding: 8px 16px calc(22px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform .34s var(--ease);
}
.sheet-root.open .sheet-panel { transform: translateY(0); }
.sheet-panel::-webkit-scrollbar { display: none; }
.sheet-grip { width: 42px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.18); margin: 6px auto 14px; }
.sheet-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
.sheet-sub { font-size: 13.5px; color: var(--muted); margin-bottom: 16px; }

/* ---------- toast ---------- */
.toast-root { position: fixed; inset-block-start: 14px; inset-inline: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  max-width: 90%; padding: 13px 18px;
  background: rgba(20,31,59,0.97); border: 1px solid var(--line);
  border-radius: 999px; font-size: 14px; font-weight: 600;
  box-shadow: var(--shadow-2);
  display: flex; align-items: center; gap: 8px;
  animation: toastIn .28s var(--ease);
}
.toast.ok { border-color: rgba(78,139,107,0.5); }
.toast.err { border-color: rgba(196,89,92,0.5); }
.toast svg { flex: 0 0 16px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px);} to { opacity:1; transform:none;} }

/* ---------- empty state ---------- */
.empty { padding: 46px 26px; text-align: center; }
.empty-ico {
  width: 74px; height: 74px; margin: 0 auto 14px;
  border-radius: 50%; display: grid; place-items: center;
  background: rgba(198,161,91,0.08); border: 1px solid var(--line);
  color: var(--gold);
}
.empty b { display: block; font-size: 17px; margin-bottom: 6px; }
.empty span { font-size: 13.5px; color: var(--muted); display: block; max-width: 250px; margin: 0 auto 16px; }

/* ---------- misc ---------- */
.tabs { display: flex; gap: 6px; padding: 12px 14px 0; }
.tab {
  flex: 1; height: 46px; border-radius: var(--r-md);
  display: grid; place-items: center;
  font-size: 14.5px; font-weight: 700; color: var(--muted);
  background: rgba(255,255,255,0.04); border: 1px solid var(--line-soft);
}
.tab.active { background: rgba(198,161,91,0.14); color: var(--gold-bright); border-color: var(--line); }

.list-note {
  margin: 14px 14px 0; padding: 13px 14px;
  font-size: 12.5px; color: var(--muted);
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  display: flex; gap: 8px; align-items: flex-start;
}
.list-note svg { flex: 0 0 15px; color: var(--gold); margin-top: 1px; }

.price-card {
  padding: 16px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line-soft);
  margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start;
  text-align: start; width: 100%;
}
.price-card.selected { border-color: var(--gold); background: linear-gradient(140deg, rgba(198,161,91,0.14), var(--surface)); }
.price-radio { width: 20px; height: 20px; flex: 0 0 20px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 2px; display: grid; place-items: center; }
.price-card.selected .price-radio { border-color: var(--gold-bright); }
.price-card.selected .price-radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--gold-bright); }
.price-name { font-size: 15.5px; font-weight: 700; }
.price-desc { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.price-amt { margin-inline-start: auto; color: var(--gold-bright); font-weight: 700; font-size: 16.5px; white-space: nowrap; }

.steps { display: flex; align-items: center; gap: 6px; padding: 12px 14px 0; }
.step-dot { flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.1); }
.step-dot.done { background: var(--gold); }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; padding: 0 14px; }
.stat { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 12px 10px; text-align: center; }
.stat b { display: block; font-size: 22px; color: var(--gold-bright); }
.stat span { font-size: 11.5px; color: var(--muted); }

.switch { width: 44px; height: 26px; border-radius: 999px; background: rgba(255,255,255,0.12); position: relative; transition: background .22s var(--ease); flex: 0 0 44px; }
.switch::after { content: ''; position: absolute; inset-block-start: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .22s var(--ease); }
.switch.on { background: var(--gold); }
html[dir="ltr"] .switch.on::after { transform: translateX(18px); }
html[dir="rtl"] .switch.on::after { transform: translateX(-18px); }

.setting-row { display: flex; align-items: center; gap: 12px; padding: 16px 14px; border-bottom: 1px solid var(--line-soft); }
.setting-row .s-txt { flex: 1; }
.setting-row .s-txt b { display: block; font-size: 15px; font-weight: 600; }
.setting-row .s-txt span { font-size: 12.5px; color: var(--muted); }

.legal-body { padding: 16px 16px 30px; }
.legal-body h2 { font-size: 16.5px; margin: 18px 0 6px; color: var(--gold-bright); }
.legal-body p, .legal-body li { font-size: 14.5px; color: #C9C8C4; line-height: 1.95; }
.legal-body li { margin-inline-start: 18px; list-style: disc; }

.notif-row { display: flex; gap: 13px; padding: 16px 14px; border-bottom: 1px solid var(--line-soft); }
.notif-row.unread { background: rgba(198,161,91,0.05); }
.notif-ico { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 10px; display: grid; place-items: center; background: rgba(198,161,91,0.12); color: var(--gold-bright); }
.notif-txt b { display: block; font-size: 14.5px; }
.notif-txt span { font-size: 12.5px; color: var(--muted); }

.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.25); border-top-color: var(--ivory);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.09), rgba(255,255,255,0.04)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 8px; }
@keyframes sk { to { background-position: -200% 0; } }

.center-col { display: flex; flex-direction: column; align-items: center; text-align: center; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-20 { margin-top: 20px; }
.muted { color: var(--muted); }
.fs-12 { font-size: 13px; } .fs-13 { font-size: 14px; }
.gold { color: var(--gold-bright); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* Latin-script content inside RTL layout (phones, addresses, emails) */
.ltr { direction: ltr; unicode-bidi: isolate; text-align: start; display: inline-block; }
.cl-price, .price-amt, .stat b { direction: ltr; unicode-bidi: isolate; text-align: start; }
.price-card > span:nth-child(2) { flex: 1; min-width: 0; }
.price-name, .price-desc { display: block; }
.cat-label { min-height: 36px; }
input[inputmode="tel"], input[type="email"], input[inputmode="decimal"], #zipIn { direction: ltr; text-align: start; }

/* ============================================================
   V.02 additions — categories grid, photo uploads, messages,
   listing status. Same tokens as everything above.
   ============================================================ */

/* ---------- categories screen ---------- */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 0 14px;
}
.cat-cell {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 16px 8px;
  border-radius: var(--r-md);
  background: linear-gradient(150deg, var(--surface-2), #101a33);
  border: 1px solid var(--line-soft);
  color: var(--ivory);
  min-height: 104px;
  transition: transform .12s var(--ease), border-color .18s var(--ease);
}
.cat-cell:active { transform: scale(0.96); border-color: rgba(198,161,91,0.45); }
.cat-cell .cc-ico {
  width: 44px; height: 44px; border-radius: 13px;
  display: grid; place-items: center;
  background: rgba(198,161,91,0.13); color: var(--gold-bright);
}
.cat-cell .cc-label { font-size: 13px; line-height: 1.35; text-align: center; }
.cat-cell .cc-count { font-size: 11px; color: var(--muted); }

/* ---------- photo upload ---------- */
.ph-thumb {
  position: relative; flex: 0 0 96px; height: 96px;
  border-radius: 10px; overflow: hidden;
  border: 1px solid var(--line-soft);
  background: var(--surface-2);
}
.ph-thumb img { width: 100%; height: 100%; object-fit: cover; }
.ph-thumb .ph-x {
  position: absolute; inset-block-start: 4px; inset-inline-end: 4px;
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(9,14,26,0.82); color: #E79A9C;
  border: 1px solid var(--line);
}
.ph-thumb .ph-main {
  position: absolute; inset-block-end: 0; inset-inline: 0;
  font-size: 10.5px; text-align: center; padding: 3px 2px;
  background: rgba(9,14,26,0.78); color: var(--muted);
}
.ph-thumb.is-main { border-color: var(--gold); }
.ph-thumb.is-main .ph-main { background: linear-gradient(145deg, var(--gold-bright), var(--gold)); color: #14213d; font-weight: 700; }

/* listing photo gallery */
.cl-gallery { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 14px; }
.cl-gallery::-webkit-scrollbar { display: none; }
.cl-gallery img { flex: 0 0 78%; height: 210px; object-fit: cover; border-radius: var(--r-md); border: 1px solid var(--line-soft); }
.cl-img img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- status pill ---------- */
.badge-pending { color: #E4C77E; background: rgba(198,161,91,0.14); border-color: rgba(198,161,91,0.4); }

/* ---------- messages ---------- */
.msg-list { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.msg {
  max-width: 78%; padding: 10px 13px; border-radius: 16px;
  font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
}
.msg.me { align-self: flex-end; background: linear-gradient(145deg, var(--gold-bright), var(--gold)); color: #14213d; border-end-end-radius: 5px; }
.msg.them { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line-soft); border-end-start-radius: 5px; }
.msg-when { font-size: 11px; opacity: .7; margin-top: 3px; }
.msg-bar { display: flex; gap: 8px; padding: 0 14px 14px; align-items: flex-end; }
.msg-bar .textarea { min-height: 48px; }

</style>
</head>
