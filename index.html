<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0B1526" />
  <!-- The second layer, and it does not excuse the first. `esc()` is what
       stops the injection; this is what stops it MATTERING if one site is
       ever missed — injected code is not a file from this origin, so
       `script-src 'self'` refuses to run it.

       Every host in `connect-src` is one the app really calls: the ZIP
       lookup and the two reverse-geocoders. A host forgotten here fails
       SILENTLY, which is why the prayer times, the fonts and the location
       flow are all tested after any change to this line.

       `style-src` needs 'unsafe-inline': the app sets `style="…"` on
       elements it builds, and an advertiser's own colour is one of them.
       That is a style, not a script, and it cannot execute. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.bigdatacloud.net https://api.zippopotam.us; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />

  <title>ARABNA · عربنا</title>
  <meta name="description" content="ARABNA · عربنا — دليل الأعمال العربية، السوق، والفعاليات، ومجلة المجتمع العربي في أمريكا." />

  <!-- THE LINK WHEN IT IS SENT, and this matters more than the page it opens.
       This community passes things along on WhatsApp, and a bare blue line
       with no picture is passed along by nobody. The absolute URLs are
       required: the scraper fetches them from its own server, where a
       relative path means nothing.

       ⚠️ THE CARD CANNOT KNOW THE READER'S CITY. It is read on WhatsApp's
       server before anybody opens anything, so the image says «Houston» and
       is replaced by hand the day the directory covers a second city worth
       naming.

       ⚠️ AND EVERY LINK PREVIEWS AS THE APP, NOT AS THE PAGE. Our routes
       carry a `#`, and nothing after a `#` ever reaches the server — so
       whoever shares «مطعم الشامي» gets the app's own card, not the shop's.
       A card per page needs real paths with no `#`, which is the same thing
       opening the native app from a link will need (Universal Links). Two
       needs, one decision, and its place is the server batch where it costs
       nothing. -->
  <meta property="og:site_name"   content="ARABNA · عربنا" />
  <meta property="og:title"       content="عربنا · ARABNA" />
  <meta property="og:description" content="مطاعم وأسواق وأطبّاء ومساجد وكنائس، ومواقيت الصلاة، وسوق للبيع والشراء." />
  <meta property="og:image"       content="https://arabna.app/assets/share-1200x630.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url"         content="https://arabna.app/" />
  <meta property="og:type"        content="website" />
  <meta property="og:locale"      content="ar_AR" />
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="عربنا · ARABNA" />
  <meta name="twitter:description" content="مطاعم وأسواق وأطبّاء ومساجد وكنائس، ومواقيت الصلاة، وسوق للبيع والشراء." />
  <meta name="twitter:image"       content="https://arabna.app/assets/share-1200x630.png" />

  <!-- installable on the home screen. The service worker is in sw.js; its
       cache name carries APP_VERSION from js/data.js, so raising that number
       is what retires the old cache. -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" sizes="180x180" />
  <link rel="apple-touch-icon" href="assets/icons/icon-152.png" sizes="152x152" />
  <link rel="apple-touch-icon" href="assets/icons/icon-120.png" sizes="120x120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="عربنا" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div id="phone" class="phone">
    <header id="appHeader" class="app-header"></header>
    <main id="app" class="app-main"></main>
    <nav id="bottomNav" class="bottom-nav"></nav>
    <!-- ⚠️ «أضِفه إلى شاشتك» sits ABOVE the bar and inside the phone, not in
         the page flow: Home's fold is measured and sold — the paid slider
         at 393px, «مميّز هذا الأسبوع» at 695 — and a strip in the flow
         would push both down for one line that is shown once. -->
    <div id="installBar" class="install-bar" hidden></div>
  </div>

  <div id="drawer" class="drawer-root" aria-hidden="true"></div>
  <div id="sheet" class="sheet-root" aria-hidden="true"></div>
  <!-- ⚠️ The greeting has its own root, NOT `#sheet`: `render()` empties
       the sheet on every navigation, the first paint at boot included, so
       a card opened from the boot sequence would never be seen. -->
  <div id="greet" class="greet-root" aria-hidden="true"></div>
  <div id="toast" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
